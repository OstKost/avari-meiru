[package]
name = "mieru-desktop"
version = "0.1.1"
description = "Mieru desktop client"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.77"

[workspace]
members = [".", "crates/mieru-shared", "crates/mieru-helper"]
resolver = "2"

[lib]
name = "mieru_desktop_lib"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "mieru-desktop"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
mieru-shared = { path = "crates/mieru-shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
